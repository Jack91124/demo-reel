name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install demo-reel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest tests -q

      - name: End-to-end render (MP4 + GIF)
        run: |
          python -m demoreel inspect demos/aem.toml
          python -m demoreel render demos/aem.toml -o out/ci.mp4 --quiet
          python -m demoreel render demos/claude-session.toml -o out/ci.gif --gif --quiet
          python -m demoreel still demos/aem.toml -o out/ci.png --at 3.0

      - name: Verify the artefacts are real media files
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          for path in ("out/ci.mp4", "out/ci.gif", "out/ci.png"):
              size = os.path.getsize(path)
              assert size > 10_000, f"{path} is suspiciously small ({size} bytes)"
              print(f"{path:14s} {size/1024:8.1f} KB")
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-print_format", "json",
               "-show_format", "-show_streams", "out/ci.mp4"],
              check=True, capture_output=True, text=True).stdout
          info = json.loads(probe)
          w = info["streams"][0]["width"]
          h = info["streams"][0]["height"]
          dur = float(info["format"]["duration"])
          print(f"mp4            {w}x{h}  {dur:.2f}s")
          assert (w, h) == (1600, 900), (w, h)
          assert dur > 5, dur
          PY

  lint:
    name: syntax + packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Byte-compile every module
        run: python -m compileall -q demoreel tests
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the wheel actually contains the package
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          need = ["demoreel/cli.py", "demoreel/term.py", "demoreel/fromsession.py"]
          missing = [n for n in need if n not in names]
          print(wheel, len(names), "files")
          if missing:
              sys.exit(f"missing from wheel: {missing}")
          PY
